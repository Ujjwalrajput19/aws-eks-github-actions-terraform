apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-2048-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ujjwalrajput19/aws-eks-github-actions-terraform.git
    targetRevision: main
    path: infrastructure/k8s-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
